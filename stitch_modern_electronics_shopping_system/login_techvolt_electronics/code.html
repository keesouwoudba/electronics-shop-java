<body class="bg-background text-on-background min-h-screen flex flex-col font-body-main text-body-main antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Suppressed Navigation: Intent is transactional (Login) -->
<main class="flex-grow flex items-center justify-center p-md">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30 p-xl transition-shadow duration-300 hover:shadow-md">
<div class="text-center mb-xl">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight mb-xs">TechVolt Electronics</h1>
<p class="font-body-main text-body-main text-secondary">Sign in to your account</p>
</div>
<form class="space-y-lg">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs" for="username">Username</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined">person</span>
</div>
<input class="block w-full pl-xl pr-sm py-sm rounded-lg border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary/20 text-on-surface transition-colors font-body-main text-body-main shadow-sm" id="username" name="username" placeholder="admin@techvolt.com" required="" type="text"/>
</div>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined">lock</span>
</div>
<input class="block w-full pl-xl pr-sm py-sm rounded-lg border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary/20 text-on-surface transition-colors font-body-main text-body-main shadow-sm" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary/50 bg-surface" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-xs font-body-main text-body-main text-secondary" for="remember-me">Remember me</label>
</div>
<div class="text-sm">
<a class="font-body-main text-data-tabular font-medium text-primary hover:text-primary-container transition-colors" href="#">Forgot your password?</a>
</div>
</div>
<div>
<button class="w-full flex justify-center py-sm px-lg border border-transparent rounded-lg shadow-sm font-label-caps text-label-caps text-on-primary bg-primary hover:bg-primary-container hover:text-on-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200" type="submit">
                        Login
                    </button>
</div>
</form>
<div class="mt-lg text-center">
<p class="font-body-main text-data-tabular text-secondary">
                    Don't have an account? 
                    <a class="font-medium text-primary hover:text-primary-container transition-colors" href="#">Contact Admin</a>
</p>
</div>
</div>
</main>
<!-- Suppressed Footer: Intent is transactional (Login) -->
